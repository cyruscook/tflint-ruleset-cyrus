name: release

on:
  push:
    tags:
    - v*.*.*

  workflow_call:
    inputs:
      tag:
        description: Exact release tag to publish
        required: true
        type: string
    secrets:
      GPG_PRIVATE_KEY:
        required: true
      PASSPHRASE:
        required: true

# Serialize the reusable and manual-tag paths for the same release.
concurrency:
  group: publish-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
    - name: Validate release tag
      run: '[[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]'
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: refs/tags/${{ inputs.tag || github.ref_name }}
        fetch-depth: 0
        persist-credentials: false
    - name: Verify exact tag checkout
      run: test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
    - name: Avoid republishing existing assets
      id: assets
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: |
        if response=$(gh api "repos/$GH_REPO/releases/tags/$RELEASE_TAG"); then
          count=$(jq '.assets | length' <<< "$response")
          if [ "$count" -gt 0 ]; then
            echo "Release already has assets; refusing to overwrite them. Inspect partial uploads manually before retrying." >> "$GITHUB_STEP_SUMMARY"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
        else
          # Only a missing release is expected for a new manually pushed tag.
          jq -e '.status == "404"' <<< "$response" > /dev/null
        fi
        echo "publish=true" >> "$GITHUB_OUTPUT"
    - name: Set up Go
      if: steps.assets.outputs.publish == 'true'
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: 'go.mod'
    - name: Test release source
      if: steps.assets.outputs.publish == 'true'
      run: make test
    - name: Import GPG key
      if: steps.assets.outputs.publish == 'true'
      id: import_gpg
      uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
      with:
        gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
        passphrase: ${{ secrets.PASSPHRASE }}
    - name: Run GoReleaser
      if: steps.assets.outputs.publish == 'true'
      uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
      with:
        version: latest
        args: release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
        GORELEASER_CURRENT_TAG: ${{ env.RELEASE_TAG }}
    - if: steps.assets.outputs.publish == 'true'
      uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
      with:
        subject-path: 'dist/checksums.txt'
