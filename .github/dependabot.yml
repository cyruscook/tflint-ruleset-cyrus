version: 2
updates:
- package-ecosystem: gomod
  directory: "/"
  schedule:
    interval: weekly
  open-pull-requests-limit: 10
  cooldown:
    default-days: 5
  groups:
    go-minor-and-patch:
      applies-to: version-updates
      patterns:
      - "*"
      update-types:
      - minor
      - patch

- package-ecosystem: "github-actions"
  directory: "/"
  schedule:
    interval: weekly
  cooldown:
    default-days: 5
  groups:
    github-actions-minor-and-patch:
      applies-to: version-updates
      patterns:
      - "*"
      update-types:
      - minor
      - patch
